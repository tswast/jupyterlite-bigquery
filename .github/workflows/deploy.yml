name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the dependencies
        run: |
          python -m pip install -r requirements.txt pyodide-build wheel==0.43.0
      - name: Build the bigquery-lite wheel
        run: |
          mkdir -p dist-wheels
          # Use pyodide build for better compatibility with Pyodide
          pyodide build packages/bigquery-lite --output-dir dist-wheels
      - name: Download and prepare custom Pyodide
        run: |
          curl -L https://github.com/pyodide/pyodide/releases/download/0.29.0/pyodide-0.29.0.tar.bz2 -o pyodide.tar.bz2
          mkdir -p pyodide-prep
          tar -xf pyodide.tar.bz2 -C pyodide-prep
          # The tarball has a top-level 'pyodide' directory.
          cp dist-wheels/*.whl pyodide-prep/pyodide/
          # Run indexing from within the directory for relative paths
          cd pyodide-prep/pyodide
          # Try using the official tool first, it should work with 0.29.0
          pyodide lockfile add-wheels *.whl --input pyodide-lock.json --output pyodide-lock.json || python -c "
          import json, hashlib, glob
          from pathlib import Path
          lock_path = Path('pyodide-lock.json')
          lock = json.loads(lock_path.read_text())
          for whl in glob.glob('bigquery_lite*.whl'):
              whl_path = Path(whl)
              sha256 = hashlib.sha256(whl_path.read_bytes()).hexdigest()
              name = 'bigquery-lite'
              lock['packages'][name] = {
                  'name': name,
                  'version': '0.1.0',
                  'file_name': whl_path.name,
                  'install_dir': 'site',
                  'package_type': 'package',
                  'imports': ['bigquery_lite'],
                  'depends': [],
                  'sha256': sha256,
                  'unvendored_tests': False
              }
          lock_path.write_text(json.dumps(lock, indent=2))
          "
          cd ../..
          tar -cjf pyodide-custom.tar.bz2 -C pyodide-prep pyodide
      - name: Build the JupyterLite site
        run: |
          cp README.md content
          jupyter lite build --contents content --output-dir dist --pyodide pyodide-custom.tar.bz2
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
